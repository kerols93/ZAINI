<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <!-- Sharp Streetwear Shadow -->
    <filter id="crispShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="zGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E15"/>
      <stop offset="100%" stop-color="#FF3800"/>
    </linearGradient>
  </defs>

  <!-- Clean White Background Box with Subtle Dark Border -->
  <rect x="6" y="6" width="508" height="128" rx="16" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5" filter="url(#crispShadow)"/>

  <!-- Streetwear Icon / Geometric Monogram Box -->
  <g transform="translate(24, 20)">
    <!-- Black Box Emblem with Rounded Corners -->
    <rect x="0" y="0" width="100" height="100" rx="16" fill="#0A0A0A" />
    
    <!-- Top-Right Street Accent Bar -->
    <rect x="70" y="12" width="16" height="4" fill="url(#accentGrad)" rx="2" />
    
    <!-- Stylized Geometric "Z" Monogram Symbol -->
    <path d="M 26 28 L 74 28 L 74 36 L 44 68 L 74 68 L 74 76 L 26 76 L 26 68 L 56 36 L 26 36 Z" fill="url(#zGradient)" />
    
    <!-- Dynamic Street Accent Diamond inside the Z angle -->
    <polygon points="50,47 55,52 50,57 45,52" fill="url(#accentGrad)"/>

    <!-- Bottom Tag: FASHION -->
    <rect x="22" y="81" width="56" height="12" rx="3.5" fill="url(#accentGrad)" />
    <text x="50" y="90.5" font-family="'Cairo', 'Montserrat', sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      FASHION
    </text>
  </g>

  <!-- Main Brand Typography: ZAINI -->
  <text x="142" y="70" font-family="'Cairo', 'Poppins', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="46" fill="#0A0A0A" letter-spacing="3">
    ZAINI<tspan fill="#FF5E15">.</tspan>
  </text>
  
  <!-- Arabic Brand Badge / Pill -->
  <rect x="312" y="42" width="60" height="26" rx="6" fill="#0A0A0A" />
  <text x="342" y="60.5" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">
    زيني
  </text>

  <!-- Modern Arabic Subtitle / Tagline for Men & Youth -->
  <text x="144" y="103" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="800" font-size="15" fill="#4A5568" letter-spacing="0.5">
    أزياء شبابية ورجالية فاخرة • براند ستريت وير مصري
  </text>

  <!-- Streetwear Minimal Accent Elements -->
  <line x1="430" y1="38" x2="494" y2="38" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="488" cy="54" r="4.5" fill="#FF5E15" />
  <line x1="446" y1="54" x2="476" y2="54" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round" />
  <text x="494" y="74" font-family="'Montserrat', sans-serif" font-weight="800" font-size="8" fill="#A0AEC0" text-anchor="end" letter-spacing="2">
    EST. 2026
  </text>
</svg>