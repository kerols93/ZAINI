<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="favAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E15"/>
      <stop offset="100%" stop-color="#FF3800"/>
    </linearGradient>
    <linearGradient id="favZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Crisp White Background with subtle dark border -->
  <rect width="120" height="120" rx="28" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/>
  
  <!-- Centered Streetwear Emblem -->
  <g transform="translate(18, 18)">
    <rect width="84" height="84" rx="18" fill="#0A0A0A" />
    
    <!-- Top-Right Street Accent Dot -->
    <circle cx="68" cy="16" r="4" fill="url(#favAccent)" />
    
    <!-- Stylized Geometric "Z" Monogram Symbol -->
    <path d="M 22 24 L 62 24 L 62 31 L 37 57 L 62 57 L 62 64 L 22 64 L 22 57 L 47 31 L 22 31 Z" fill="url(#favZ)" />
    
    <!-- Bottom Tag: ZAINI -->
    <rect x="18" y="68" width="48" height="10" rx="3" fill="url(#favAccent)" />
    <text x="42" y="76" font-family="'Cairo', 'Montserrat', sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      ZAINI
    </text>
  </g>
</svg>